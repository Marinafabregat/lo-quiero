{% extends "base.html" %}
{% block title %}{{ title }} — ¿Lo quiero?{% endblock %}

{% block content %}
  <div class="max-w-lg mx-auto">
    <div class="card text-center">
      <h1 class="text-2xl font-bold text-slate-900 mb-2">{{ title }}</h1>
      <p class="text-lg font-medium text-slate-700 mb-2">¿Seguro que quieres eliminar «{{ object_name }}»?</p>
      {% if detail %}<p class="text-sm text-slate-500 mb-6">{{ detail }}</p>{% endif %}

      <form method="post" class="flex flex-wrap justify-center gap-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% if back_arg %}{% url back_url back_arg %}{% else %}{% url back_url %}{% endif %}"
           class="btn btn-ghost">Cancelar</a>
      </form>
    </div>
  </div>
{% endblock %}
