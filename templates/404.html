{% extends "base.html" %}

{% block title %}Página no encontrada — ¿Lo quiero?{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md text-center py-16">
    <p class="text-6xl font-bold text-blue-700">404</p>
    <h1 class="mt-3 text-xl font-semibold text-slate-900">Página no encontrada</h1>
    <p class="mt-2 text-sm text-slate-500">
      La página que buscas no existe o ha sido movida.
      Comprueba la dirección o vuelve al panel.
    </p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary mt-10">Volver al panel</a>
  </div>
{% endblock %}
